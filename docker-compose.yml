version: '3.8'

services:
  mysql-db:
    image: mysql:8.0
    container_name: mysql-pagos-db
    restart: always
    environment:
      MYSQL_DATABASE: pagos_db
      MYSQL_ROOT_PASSWORD: 123456
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - pagos-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p123456"]
      interval: 5s
      timeout: 3s
      retries: 10
  recomendaciones: 
    build: 
      context: ./recomendaciones
    container_name: recomendaciones
    ports: 
      - "8084:8080"
    environment:
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=${SPRING_KAFKA_BOOTSTRAP_SERVERS}
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-db:3306/pagos_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=123456
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - URL_RECOMENDACIONES=${URL_RECOMENDACIONES}
    depends_on:
      mysql-db:
        condition: service_healthy
    networks:
      - pagos-network

volumes:
  mysql_data:

networks:
  pagos-network:
    driver: bridge